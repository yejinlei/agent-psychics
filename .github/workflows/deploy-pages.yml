name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/data/*.csv'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          set -euo pipefail
          rm -rf gh-pages && mkdir -p gh-pages/data
          # 站点根 → frontend 的静态资源（index.html 放根，css/js 平铺）
          cp frontend/index.html  gh-pages/
          cp -r frontend/css  gh-pages/
          cp -r frontend/js   gh-pages/
          # CSV 数据 → /data/
          cp backend/data/*.csv gh-pages/data/
          echo "=== gh-pages root ==="
          ls -la gh-pages/
          echo "=== files ==="
          find gh-pages -maxdepth 3 -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages/.

      - id: deployment
        uses: actions/deploy-pages@v4
